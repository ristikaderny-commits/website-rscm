<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Hasil Laboratorium - RSCM</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', Arial, sans-serif;
            background-color: #f1f5f9;
            color: #111827;
            padding: 16px;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .action-bar {
            max-width: 820px;
            margin: 0 auto 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 16px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
        }

        .action-bar-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: #1f2937;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-print {
            background-color: #b91c1c;
            color: #ffffff;
            border: none;
            padding: 7px 14px;
            border-radius: 7px;
            font-family: inherit;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-print:hover {
            background-color: #991b1b;
        }

        .btn-close {
            background-color: #ffffff;
            color: #374151;
            border: 1px solid #cbd5e1;
            padding: 7px 14px;
            border-radius: 7px;
            font-family: inherit;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-close:hover {
            background-color: #f8fafc;
        }

        .report-sheet {
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            background-color: #ffffff;
            color: #111827;
            padding: 18px 24px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
        }

        .kop {
            text-align: center;
            padding-bottom: 8px;
            border-bottom: 2px solid #111827;
            margin-bottom: 10px;
        }

        .kop-top {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            color: #111827;
            margin-bottom: 2px;
        }

        .kop h1 {
            font-size: 1.08rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #111827;
            margin-bottom: 2px;
        }

        .kop p {
            font-size: 0.72rem;
            color: #4b5563;
        }

        .patient-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px 24px;
            font-size: 0.75rem;
            line-height: 1.35;
            padding-bottom: 8px;
            margin-bottom: 9px;
            border-bottom: 1px solid #374151;
        }

        .info-row {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .info-label {
            flex: 0 0 96px;
            font-weight: 600;
            color: #1f2937;
        }

        .info-val {
            flex: 1;
            color: #111827;
            word-break: break-word;
        }

        .section-title {
            text-align: center;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
            color: #111827;
        }

        table.lab-report-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.71rem;
            line-height: 1.25;
            margin-bottom: 9px;
        }

        table.lab-report-table th,
        table.lab-report-table td {
            padding: 3.5px 5px;
            border-bottom: 1px solid #d1d5db;
            text-align: left;
            vertical-align: middle;
        }

        table.lab-report-table th {
            font-weight: 700;
            color: #111827;
            border-top: 1px solid #6b7280;
            border-bottom: 1.5px solid #111827;
            background-color: #f8fafc;
        }

        .row-normal {
            background-color: #ffffff;
        }

        .row-high,
        .row-low {
            background-color: #ecfccb;
            font-weight: 600;
        }

        .row-critical {
            background-color: #fecdd3;
            color: #881337;
            font-weight: 700;
        }

        .ket-normal {
            color: #4b5563;
            font-weight: 600;
        }

        .ket-high,
        .ket-low {
            color: #3f6212;
            font-weight: 700;
        }

        .ket-critical {
            color: #be123c;
            font-weight: 700;
        }

        .meta-footer {
            font-size: 0.72rem;
            line-height: 1.35;
            margin-bottom: 10px;
            color: #111827;
        }

        .sign-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            text-align: center;
            font-size: 0.75rem;
            line-height: 1.35;
            margin-bottom: 8px;
        }

        .sign-space {
            height: 36px;
        }

        .disclaimer {
            font-size: 0.65rem;
            line-height: 1.3;
            color: #4b5563;
        }

        .empty-state {
            text-align: center;
            padding: 36px 16px;
            font-size: 0.9rem;
            color: #4b5563;
        }

        @page {
            size: A4 portrait;
            margin: 8mm 10mm;
        }

        @media print {
            body {
                background-color: #ffffff;
                padding: 0;
            }

            .action-bar {
                display: none !important;
            }

            .report-sheet {
                width: 100%;
                max-width: 100%;
                margin: 0;
                padding: 0;
                border: none;
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="action-bar">
        <div class="action-bar-title">Pratinjau Cetak Hasil Laboratorium (1 Lembar A4)</div>
        <div class="action-buttons">
            <button type="button" id="btnPrintNow" class="btn-print">
                <i class="fa-solid fa-print"></i> Cetak / Simpan PDF
            </button>
            <button type="button" id="btnCloseWindow" class="btn-close">Tutup</button>
        </div>
    </div>

    <main id="reportSheet" class="report-sheet"></main>

    <script>
        const STORAGE_PENDAFTARAN = 'dataPendaftaranRSCM';
        const STORAGE_PASIEN_LAMA = 'dataPasienRSCM';
        const STORAGE_HASIL_LAB = 'hasilLaboratoriumRSCM';

        const DEFAULT_PENANGGUNG_JAWAB = 'dr. [Nama Dokter Penanggung Jawab], Sp.PK';
        const DEFAULT_PETUGAS_LAB = '[Nama Petugas], S.Tr. Kes.';

        const KATALOG_DEFAULT = {
            'Hemoglobin': { satuan: 'g/dL', rujukan: '11.5 - 14.3', kritisTeks: '< 7.0 dan > 20', metode: 'Automated hematology analyzer', minNormal: 11.5, maxNormal: 14.3, critLow: 7.0, critHigh: 20 },
            'Hematokrit': { satuan: '%', rujukan: '34 - 42', kritisTeks: '< 20 dan > 60', metode: 'Automated hematology analyzer', minNormal: 34, maxNormal: 42, critLow: 20, critHigh: 60 },
            'Eritrosit': { satuan: 'juta/mm³', rujukan: '4.0 - 5.50', kritisTeks: '-', metode: 'Automated hematology analyzer', minNormal: 4.10, maxNormal: 5.20, critLow: null, critHigh: null },
            'Leukosit': { satuan: '/mm³', rujukan: '3800 - 10400', kritisTeks: '< 2000 dan > 40000', metode: 'Automated hematology analyzer', minNormal: 3800, maxNormal: 10400, critLow: 2000, critHigh: 40000 },
            'Trombosit': { satuan: '/mm³', rujukan: '187000 - 400000', kritisTeks: '< 50000 dan > 800000', metode: 'Automated hematology analyzer', minNormal: 187000, maxNormal: 400000, critLow: 50000, critHigh: 800000 },
            'MCV': { satuan: 'fL', rujukan: '77.8 - 91.1', kritisTeks: '-', metode: 'Calculated', minNormal: 77.8, maxNormal: 91.1, critLow: null, critHigh: null },
            'MCH': { satuan: 'pg', rujukan: '25 - 33', kritisTeks: '-', metode: 'Calculated', minNormal: 25, maxNormal: 33, critLow: null, critHigh: null },
            'MCHC': { satuan: 'g/dL', rujukan: '32 - 36', kritisTeks: '-', metode: 'Calculated', minNormal: 32, maxNormal: 36, critLow: null, critHigh: null },
            'Masa Protrombin (PT)': { satuan: 'detik', rujukan: '9.4 - 12.5', kritisTeks: '> 50', metode: 'Coagulometer', minNormal: 9.4, maxNormal: 12.5, critLow: null, critHigh: 50 },
            'INR': { satuan: '', rujukan: '0.9 - 1.1', kritisTeks: '> 3.0', metode: 'Calculated', minNormal: 0.9, maxNormal: 1.1, critLow: null, critHigh: 3.0 },
            'APTT': { satuan: 'detik', rujukan: '25 - 37', kritisTeks: '> 100', metode: 'Coagulometer', minNormal: 25, maxNormal: 37, critLow: null, critHigh: 100 },
            'D-dimer': { satuan: 'ng/mL FEU', rujukan: '≤ 500', kritisTeks: '-', metode: 'Immunoturbidimetric', minNormal: null, maxNormal: 500, critLow: null, critHigh: null }
        };

        function buatKeyPasien(item, index) {
            if (item.nomorAntrean) return `${item.nomorAntrean}__${item.noRm || index}`;
            if (item.noRm) return `RM-${item.noRm}__${index}`;
            return `PASIEN-${index}`;
        }

        function ambilSemuaPasien() {
            const dataDaftar = JSON.parse(localStorage.getItem(STORAGE_PENDAFTARAN)) || [];
            const dataLama = JSON.parse(localStorage.getItem(STORAGE_PASIEN_LAMA)) || [];

            const dariPendaftaran = dataDaftar.map((item, idx) => ({
                key: buatKeyPasien(item, idx),
                nomorTransaksi: item.nomorTransaksi || item.nomorAntrean || `RSCM-${String(idx + 1).padStart(3, '0')}`,
                noRm: item.noRm || '-',
                nama: item.nama || '-',
                tanggalLahir: item.tanggalLahir || '-',
                umur: item.umur !== undefined && item.umur !== '' ? item.umur : '-',
                jenisKelamin: item.jenisKelamin || '-',
                alamat: item.alamat || '-',
                jenisPasien: item.jenisPasien || '-',
                nomorAsuransi: item.nomorAsuransi || '-',
                poliRujukan: item.poliRujukan || item.tujuan || '-',
                dokterPengirim: item.dokterPengirim || '-',
                tanggalOrder: item.tanggalOrder || item.waktuDaftar || '-'
            }));

            const dariDataLama = dataLama.map((item, idx) => ({
                key: `LEGACY-${idx}`,
                nomorTransaksi: `RSCM-L${String(idx + 1).padStart(2, '0')}`,
                noRm: item.noRm || '-',
                nama: item.nama || '-',
                tanggalLahir: item.tanggalLahir || '-',
                umur: item.umur || '-',
                jenisKelamin: item.jenisKelamin || '-',
                alamat: item.alamat || '-',
                jenisPasien: '-',
                nomorAsuransi: '-',
                poliRujukan: 'Laboratorium',
                dokterPengirim: item.dokterPengirim || '-',
                tanggalOrder: item.tanggalPeriksa || '-'
            }));

            return [...dariPendaftaran, ...dariDataLama];
        }

        function parseAngka(nilai) {
            if (nilai === null || nilai === undefined) return null;
            const bersih = String(nilai).trim().replace(',', '.');
            if (bersih === '' || bersih === '-') return null;
            if (!/^[+-]?\d+(\.\d+)?$/.test(bersih)) return null;
            const num = parseFloat(bersih);
            return Number.isNaN(num) ? null : num;
        }

        function evaluasiStatus(namaParam, hasilTeks, meta) {
            const trimmed = String(hasilTeks ?? '').trim();
            if (trimmed === '' || trimmed === '-') {
                return { label: '-', rowClass: 'row-normal', ketClass: 'ket-normal' };
            }
            const angka = parseAngka(trimmed);
            if (angka === null || !meta) {
                return { label: 'Normal', rowClass: 'row-normal', ketClass: 'ket-normal' };
            }
            if (meta.critLow !== null && meta.critLow !== undefined && angka < meta.critLow) {
                return { label: 'CRITICAL', rowClass: 'row-critical', ketClass: 'ket-critical' };
            }
            if (meta.critHigh !== null && meta.critHigh !== undefined && angka > meta.critHigh) {
                return { label: 'CRITICAL', rowClass: 'row-critical', ketClass: 'ket-critical' };
            }
            if (meta.minNormal !== null && meta.minNormal !== undefined && angka < meta.minNormal) {
                return { label: 'Low', rowClass: 'row-low', ketClass: 'ket-low' };
            }
            if (meta.maxNormal !== null && meta.maxNormal !== undefined && angka > meta.maxNormal) {
                return { label: 'High', rowClass: 'row-high', ketClass: 'ket-high' };
            }
            return { label: 'Normal', rowClass: 'row-normal', ketClass: 'ket-normal' };
        }

        function formatTanggalSingkat(nilaiTgl) {
            if (!nilaiTgl || nilaiTgl === '-') return '-';
            const d = new Date(nilaiTgl);
            if (!Number.isNaN(d.getTime()) && String(nilaiTgl).includes('T')) {
                return `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}, ${String(d.getHours()).padStart(2, '0')}.${String(d.getMinutes()).padStart(2, '0')}`;
            }
            return nilaiTgl;
        }

        function renderLaporan() {
            const sheet = document.getElementById('reportSheet');
            const params = new URLSearchParams(window.location.search);
            const targetKey = params.get('key');

            const semuaPasien = ambilSemuaPasien();
            const hasilMap = JSON.parse(localStorage.getItem(STORAGE_HASIL_LAB)) || {};

            const pasien = targetKey ? semuaPasien.find((p) => p.key === targetKey) : null;
            const dataLab = pasien ? hasilMap[pasien.key] : null;

            if (!pasien || !dataLab || !Array.isArray(dataLab.items) || dataLab.items.length === 0) {
                sheet.innerHTML = `
                    <div class="empty-state">
                        Data hasil laboratorium belum tersedia untuk pasien ini atau parameter cetak belum dipilih. Silakan input dan simpan hasil terlebih dahulu dari halaman Data Pasien.
                    </div>
                `;
                return;
            }

            const barisHtml = dataLab.items.map((item) => {
                const def = KATALOG_DEFAULT[item.pemeriksaan] || {};
                const satuan = item.satuan ?? def.satuan ?? '';
                const rujukan = item.nilaiRujukan ?? def.rujukan ?? '-';
                const kritis = item.nilaiKritis ?? def.kritisTeks ?? '-';
                const metode = item.metode ?? def.metode ?? '-';
                const status = evaluasiStatus(item.pemeriksaan, item.hasil, def);
                const labelTampil = item.keterangan || status.label;
                const nilaiTampil = labelTampil === 'CRITICAL' ? `<strong>${item.hasil}</strong>` : item.hasil;

                return `
                    <tr class="${status.rowClass}">
                        <td>${item.pemeriksaan}</td>
                        <td>${nilaiTampil}</td>
                        <td>${satuan}</td>
                        <td>${rujukan}</td>
                        <td>${kritis}</td>
                        <td>${metode}</td>
                        <td class="${status.ketClass}">${labelTampil}</td>
                    </tr>
                `;
            }).join('');

            const asuransiTampil = pasien.nomorAsuransi && pasien.nomorAsuransi !== '-'
                ? `${pasien.jenisPasien} (${pasien.nomorAsuransi})`
                : pasien.jenisPasien;

            const tglOrderTampil = formatTanggalSingkat(pasien.tanggalOrder);
            const tglPeriksaTampil = formatTanggalSingkat(dataLab.tanggalPeriksa);
            const pjLab = dataLab.penanggungJawabLab || DEFAULT_PENANGGUNG_JAWAB;
            const petugasLab = dataLab.petugasLaboratorium || dataLab.dokterPenanggungJawab || DEFAULT_PETUGAS_LAB;

            sheet.innerHTML = `
                <div class="kop">
                    <div class="kop-top">
                        <i class="fa-solid fa-hospital"></i>
                        <span>KEMENTERIAN KESEHATAN REPUBLIK INDONESIA</span>
                    </div>
                    <h1>RSUP NASIONAL DR. CIPTO MANGUNKUSUMO</h1>
                    <p>Jl. Diponegoro No. 71, Jakarta Pusat | Telepon: (021) 1500135 | Website: rscm.co.id</p>
                </div>

                <div class="patient-grid">
                    <div>
                        <div class="info-row"><span class="info-label">Pasien</span><span class="info-val">: ${pasien.nama}</span></div>
                        <div class="info-row"><span class="info-label">No. RM</span><span class="info-val">: ${pasien.noRm}</span></div>
                        <div class="info-row"><span class="info-label">Tgl. Lahir</span><span class="info-val">: ${pasien.tanggalLahir}</span></div>
                        <div class="info-row"><span class="info-label">Alamat</span><span class="info-val">: ${pasien.alamat}</span></div>
                        <div class="info-row"><span class="info-label">Usia</span><span class="info-val">: ${pasien.umur} Tahun</span></div>
                        <div class="info-row"><span class="info-label">Jns. Kelamin</span><span class="info-val">: ${pasien.jenisKelamin}</span></div>
                        <div class="info-row"><span class="info-label">Asuransi</span><span class="info-val">: ${asuransiTampil}</span></div>
                    </div>
                    <div>
                        <div class="info-row"><span class="info-label">No. Transaksi</span><span class="info-val">: ${pasien.nomorTransaksi}</span></div>
                        <div class="info-row"><span class="info-label">Tgl. Order</span><span class="info-val">: ${tglOrderTampil}</span></div>
                        <div class="info-row"><span class="info-label">Tgl. Periksa</span><span class="info-val">: ${tglPeriksaTampil}</span></div>
                        <div class="info-row"><span class="info-label">Dokter Pengirim</span><span class="info-val">: ${pasien.dokterPengirim}</span></div>
                        <div class="info-row"><span class="info-label">Penanggung Jawab</span><span class="info-val">: ${pjLab}</span></div>
                        <div class="info-row"><span class="info-label">Petugas Lab</span><span class="info-val">: ${petugasLab}</span></div>
                        <div class="info-row"><span class="info-label">Pelayanan</span><span class="info-val">: ${pasien.poliRujukan}</span></div>
                    </div>
                </div>

                <div class="section-title">HASIL PEMERIKSAAN LABORATORIUM</div>

                <table class="lab-report-table">
                    <thead>
                        <tr>
                            <th>Pemeriksaan</th>
                            <th>Hasil</th>
                            <th>Satuan</th>
                            <th>Nilai Rujukan</th>
                            <th>Nilai Kritis</th>
                            <th>Metode</th>
                            <th>Keterangan</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${barisHtml}
                    </tbody>
                </table>

                <div class="meta-footer">
                    <div><strong>Dikeluarkan pada:</strong> ${tglPeriksaTampil}</div>
                    <div><strong>Rumah Sakit:</strong> RSUP Nasional Dr. Cipto Mangunkusumo</div>
                </div>

                <div class="sign-grid">
                    <div>
                        <div>Penanggung Jawab</div>
                        <div class="sign-space"></div>
                        <div><strong>${pjLab}</strong></div>
                    </div>
                    <div>
                        <div>Petugas Laboratorium</div>
                        <div class="sign-space"></div>
                        <div><strong>${petugasLab}</strong></div>
                    </div>
                </div>

                <p class="disclaimer">
                    Catatan: Nilai rujukan merupakan default sistem dan dapat berbeda menurut metode, reagen, instrumen, usia, jenis kelamin, dan kebijakan laboratorium. Nilai kritis harus mengikuti SOP laboratorium yang berlaku.
                </p>
            `;
        }

        document.getElementById('btnPrintNow').addEventListener('click', function () {
            window.print();
        });

        document.getElementById('btnCloseWindow').addEventListener('click', function () {
            if (window.opener) {
                window.close();
            } else {
                window.location.href = 'data-pasien.html';
            }
        });

        renderLaporan();
    </script>
</body>
</html>
